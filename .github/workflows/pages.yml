name: Deploy docs to GitHub Pages

on:
  push:
    branches: [master]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 若站点未开启会自动启用(Source 置为 GitHub Actions)
      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs          # docs/index.html → 站点根的 /index.html

      - id: deployment
        uses: actions/deploy-pages@v4
